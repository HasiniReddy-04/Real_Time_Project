<!DOCTYPE html>
<html>
<head>
    <title>Job Recommendations</title>

    <style>
    /* ✅ RESET DEFAULT SPACE */
    body {
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Arial, sans-serif;

        /* 🖼 FULL BACKGROUND IMAGE */
        background: url("/static/bg.jpg") no-repeat center center fixed;
        background-size: cover;
    }

    /* 🌑 OVERLAY CONTAINER */
    .main-container {
        width: 100%;
        min-height: 100vh;
        background: rgba(15, 32, 39, 0.85); /* dark overlay */
        padding: 20px;
        box-sizing: border-box;
        color: white;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
    }

    /* 📦 JOB GRID */
    .jobs-container {
        display: flex;
        flex-wrap: wrap;
        gap: 25px;
        justify-content: center;
    }

    /* 💎 JOB CARD */
    .job-card {
        background: rgba(255, 255, 255, 0.1);
        padding: 20px;
        width: 260px;
        border-radius: 12px;
        backdrop-filter: blur(12px);
        box-shadow: 0px 4px 25px rgba(0,0,0,0.4);
        transition: 0.3s;
    }

    .job-card:hover {
        transform: translateY(-6px);
    }

    .job-card h3 {
        margin-bottom: 10px;
    }

    .job-card p {
        color: #ddd;
        margin: 5px 0;
    }

    /* 🔗 BUTTON */
    .view-btn {
        display: inline-block;
        margin-top: 12px;
        padding: 8px 14px;
        background: linear-gradient(to right, #3498db, #5dade2);
        color: white;
        border-radius: 6px;
        text-decoration: none;
    }

    .view-btn:hover {
        opacity: 0.9;
    }

    /* 🔙 BACK BUTTON */
    .back-btn {
        margin-top: 40px;
        padding: 10px 18px;
        background: gray;
        color: white;
        border: none;
        border-radius: 6px;
        display: block;
        margin-left: auto;
        margin-right: auto;
        cursor: pointer;
    }

    .empty {
        text-align: center;
        color: #ddd;
    }

    </style>
</head>

<body>

<div class="main-container">

    <h1>💼 Job Recommendations</h1>

    {% if jobs %}
    <div class="jobs-container">
        {% for job in jobs %}
        <div class="job-card">
            <h3>{{ job.title }}</h3>
            <p><b>Company:</b> {{ job.company }}</p>
            <p><b>Location:</b> {{ job.location }}</p>

            <a href="/job/{{ loop.index0 }}" class="view-btn">View Details</a>
        </div>
        {% endfor %}
    </div>
    {% else %}
        <p class="empty">No jobs found.</p>
    {% endif %}

    <a href="/result">
        <button class="back-btn">Back to Result</button>
    </a>

</div>

</body>
</html>
