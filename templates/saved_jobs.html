<!DOCTYPE html>
<html>
<head>
    <title>Saved Jobs</title>
    <style>
    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .circle {
        position: absolute;
        width: 300px;
        height: 300px;
        background: rgba(255, 193, 7, 0.15);
        border-radius: 50%;
        top: 20%;
        left: 70%;
        z-index: 0;
    }
    h1 {
        position: relative;
        z-index: 1;
        color: white;
        margin: 30px 0 10px 0;
        text-align: center;
    }
    .jobs-container {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 25px;
        padding: 20px;
        max-width: 1100px;
    }
    .job-card {
        background: rgba(255, 255, 255, 0.12);
        padding: 20px;
        width: 280px;
        border-radius: 12px;
        backdrop-filter: blur(14px);
        box-shadow: 0px 4px 25px rgba(0,0,0,0.5);
        color: white;
        transition: 0.3s;
    }
    .job-card:hover { transform: translateY(-6px); }
    .job-card h3 { margin-bottom: 10px; }
    .job-card p { color: #ddd; margin: 6px 0; }
    .btn {
        padding: 10px 14px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 12px;
        color: white;
    }
    .apply  { background: linear-gradient(to right, #28a745, #2ecc71); }
    .delete { background: linear-gradient(to right, #c0392b, #e74c3c); margin-left: 8px; }
    .back   { background: linear-gradient(to right, #555, #777); margin-top: 30px; }
    .btn:hover { opacity: 0.9; }
    .empty { color: #ddd; margin-top: 20px; text-align: center; }
    .back-container { text-align: center; }

    /* Popup */
    .overlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.6);
        justify-content: center;
        align-items: center;
        z-index: 999;
    }
    .popup-box {
        background: white;
        color: #333;
        padding: 40px;
        border-radius: 12px;
        text-align: center;
        width: 350px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    </style>
</head>

<body>

<div class="circle"></div>

<h1>Saved Jobs</h1>

{% if username %}
<p style="color:white; text-align:center;">User: {{ username }}</p>
{% endif %}

{% if jobs %}
<div class="jobs-container">
    {% for job in jobs %}
    <div class="job-card">
        <h3>{{ job[1] }}</h3>
        <p><b>Company:</b> {{ job[2] }}</p>
        <p><b>Location:</b> {{ job[3] }}</p>

        <!-- Apply button opens popup -->
        <button class="btn apply"
            onclick="applyJob('{{ job[1] }}', '{{ job[2] }}')">
            Apply Now
        </button>

        <!-- Delete button -->
        <a href="/delete_job/{{ job[0] }}"
           onclick="return confirm('Are you sure you want to delete this job?')">
            <button class="btn delete">Delete</button>
        </a>

    </div>
    {% endfor %}
</div>

{% else %}
<p class="empty">No saved jobs yet.</p>
{% endif %}

<div class="back-container">
    <a href="/result">
        <button class="btn back">Back to Result</button>
    </a>
</div>

<!-- Apply Popup -->
<div id="applyPopup" class="overlay">
    <div class="popup-box">
        <h2 style="color:#27ae60;">Confirm Application</h2>
        <p id="popupTitle" style="font-weight:bold; font-size:16px;"></p>
        <p id="popupCompany" style="color:#555;"></p>
        <hr>
        <form method="POST" action="/apply">
            <input type="hidden" id="applyTitle" name="title">
            <input type="hidden" id="applyCompany" name="company">

            <button type="submit"
                style="background:linear-gradient(to right, #27ae60, #2ecc71);
                       color:white; padding:12px 25px; border:none;
                       border-radius:8px; font-size:16px; cursor:pointer; margin-right:10px;">
                Confirm Apply
            </button>

            <button type="button"
                onclick="document.getElementById('applyPopup').style.display='none'"
                style="background:#e74c3c; color:white; padding:12px 25px;
                       border:none; border-radius:8px; font-size:16px; cursor:pointer;">
                Cancel
            </button>
        </form>
    </div>
</div>

<script>
function applyJob(title, company) {
    document.getElementById('popupTitle').innerText = title;
    document.getElementById('popupCompany').innerText = company;
    document.getElementById('applyTitle').value = title;
    document.getElementById('applyCompany').value = company;
    document.getElementById('applyPopup').style.display = 'flex';
}
</script>

</body>
</html>
