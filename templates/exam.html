<!DOCTYPE html>
<html>
<head>
    <title>Start Exam</title>

   <style>
    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;

        /* 🎨 Same premium gradient */
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        height: 100vh;
    }

    /* 🟡 Decorative circle */
    .circle {
        position: absolute;
        width: 300px;
        height: 300px;
        background: rgba(255, 193, 7, 0.15);
        border-radius: 50%;
        top: 25%;
        left: 65%;
        z-index: 0;
    }

    .header {
        position: relative;
        z-index: 1;
        color: white;
        padding: 15px;
        text-align: center;
    }

    .container {
        position: relative;
        z-index: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 80vh;
    }

    /* 💎 Glass card */
    .card {
        background: rgba(255, 255, 255, 0.1);
        padding: 35px;
        width: 400px;
        border-radius: 12px;
        backdrop-filter: blur(12px);
        box-shadow: 0px 4px 25px rgba(0,0,0,0.4);
        text-align: center;
        color: white;
    }

    h1 {
        margin-bottom: 15px;
        color: white;
    }

    p {
        color: #ddd;
        margin-bottom: 10px;
    }

    button {
        margin-top: 20px;
        padding: 12px 20px;
        background: linear-gradient(to right, #27ae60, #2ecc71);
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        width: 100%;
    }

    button:hover {
        background: linear-gradient(to right, #1e8449, #27ae60);
    }
</style>
</head>

<body>

<div class="header">
    <h1>AI Skill Assessment</h1>
</div>

<div class="container">
    <div class="card">

        <h1>📝 Skill Assessment Test</h1>

        <p>This test will evaluate your skills.</p>
        <p><b>Total Duration:</b> 10 minutes</p>

        <a href="/question/0">
            <button>Start Exam</button>
        </a>

    </div>
</div>

</body>
</html>
