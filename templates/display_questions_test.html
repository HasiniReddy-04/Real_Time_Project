<!DOCTYPE html>
<html>
<head>
<title>AI SKILL ASSESSMENT TEST</title>

<style>
    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        min-height: 100vh;
        color: white;
    }

    .circle {
        position: absolute;
        width: 400px;
        height: 400px;
        background: rgba(255, 193, 7, 0.15);
        border-radius: 50%;
        top: 10%;
        left: 65%;
    }

    .container {
        width: 70%;
        max-width: 900px;
        margin: 80px auto;
        background: rgba(255, 255, 255, 0.06);
        padding: 40px;
        border-radius: 20px;
        backdrop-filter: blur(12px);
        box-shadow: 0 0 30px rgba(0,0,0,0.4);
    }

    h2 {
        text-align: center;
        font-size: 36px;
        margin-bottom: 30px;
    }

    .question-slide {
        font-size: 20px;
        line-height: 1.8;
    }

    .timer-box {
        font-size: 18px;
        font-weight: bold;
        color: #ff4d4d;
        margin-bottom: 15px;
    }

    label {
        display: block;
        margin: 10px 0;
        cursor: pointer;
    }

    input[type="radio"] {
        transform: scale(1.3);
        margin-right: 10px;
    }

    .next-btn {
        margin-top: 25px;
        padding: 12px 30px;
        font-size: 18px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(to right, #3498db, #5dade2);
        color: white;
        cursor: pointer;
        transition: 0.3s;
    }

    .next-btn:hover {
        background: linear-gradient(to right, #2980b9, #3498db);
    }
</style>

</head>
<body>

<div class="circle"></div>

<div class="container">
    <h2>AI SKILL ASSESSMENT TEST</h2>

    <form id="quizForm" method="POST" action="/submit_test">

        {% for q in questions %}
        <div class="question-slide" {% if not loop.first %}style="display:none"{% endif %}>

            <div class="timer-box">
                ⏱ Time left: <span class="timer">10</span> seconds
            </div>

            <p><b>{{ q[1] }}</b></p>

            <label><input type="radio" name="q{{ q[0] }}" value="A"> {{ q[2] }}</label>
            <label><input type="radio" name="q{{ q[0] }}" value="B"> {{ q[3] }}</label>
            <label><input type="radio" name="q{{ q[0] }}" value="C"> {{ q[4] }}</label>
            <label><input type="radio" name="q{{ q[0] }}" value="D"> {{ q[5] }}</label>

            {% if not loop.last %}
                <button type="button" class="next-btn">Next</button>
            {% else %}
                <button type="submit" class="next-btn">Submit</button>
            {% endif %}

        </div>
        {% endfor %}

    </form>
</div>

<script>
let slides = document.querySelectorAll(".question-slide");
let currentSlide = 0;
let timer;

// Timer function
function startTimer(slideIndex) {
    let timerSpan = slides[slideIndex].querySelector(".timer");
    let timeLeft = 10;
    timerSpan.textContent = timeLeft;

    timer = setInterval(() => {
        timeLeft--;
        timerSpan.textContent = timeLeft;

        if (timeLeft <= 0) {
            clearInterval(timer);
            goToNextSlide();
        }
    }, 1000);
}

// Next slide
function goToNextSlide() {
    clearInterval(timer);
    slides[currentSlide].style.display = "none";
    currentSlide++;

    if (currentSlide < slides.length) {
        slides[currentSlide].style.display = "block";
        startTimer(currentSlide);
    }
}

// Button click
document.querySelectorAll(".next-btn").forEach(btn => {
    btn.addEventListener("click", () => {
        goToNextSlide();
    });
});

// Start first question
startTimer(0);
</script>

</body>
</html>
